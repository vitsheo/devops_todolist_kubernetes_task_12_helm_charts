namespace: todoapp
serviceAccountName: todo-sa
replicaCount: 2  # Окреме значення для дефолтних реплік, щоб не конфліктувати з HPA

image:
  repository: python
  tag: "3.9"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

nodeAffinity:
  key: "topology.kubernetes.io/zone"
  values:
    - "us-east-1a"

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 80
  targetMemory: 80

pv:
  capacity: "2Gi"

pvc:
  storageRequest: "1Gi"

secrets:
  DB_HOST: "todoapp-mysql"
  DB_NAME: "todo db"

# Налаштування для суб-чарту mysql (прибрали конфліктний namespace звідси)
mysql:
  image:
    repository: mysql
    tag: "8.0"
  replicas: 1
  pvc:
    storageRequest: "2Gi"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  nodeAffinity:
    key: "app"
    value: "mysql"
  toleration:
    - key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
  secrets:
    mysql-root-password: "SuperSecretPassword123"
