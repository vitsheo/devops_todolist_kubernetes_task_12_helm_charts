namespace: todoapp
serviceAccountName: todo-sa

image:
  repository: python
  tag: "3.9"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

nodeAffinity:
  key: "topology.kubernetes.io/zone"
  values:
    - "us-east-1a"

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 80
  targetMemory: 80

pv:
  capacity: 2Gi

pvc:
  storageRequest: 1Gi

secrets:
  DB_HOST: "todoapp-mysql"
  DB_NAME: "tododb"
