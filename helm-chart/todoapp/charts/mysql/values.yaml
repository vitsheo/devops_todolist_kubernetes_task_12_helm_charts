namespace: todoapp
image:
  repository: mysql
  tag: "8.0"
replicas: 1
storageRequest: 2Gi
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"
nodeAffinity:
  key: "app"
  value: "mysql"
tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
secrets:
  mysql-root-password: "SuperSecretPassword123"
